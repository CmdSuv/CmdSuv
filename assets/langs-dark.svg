<svg width="350" height="195" viewBox="0 0 350 195" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Most Used Languages">
  <title>Most Used Languages</title>
  <defs>
    <linearGradient id="bg-l-dark" x1="0" y1="0" x2="350" y2="195" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#1a1b27"/>
    </linearGradient>
    <clipPath id="bar-clip-dark">
      <rect x="24.0" y="58.0" width="302.0" height="10.0" rx="5"/>
    </clipPath>
  </defs>
  <style>
    .title { font: 700 16.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #70a5fd; }
