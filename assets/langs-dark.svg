    .lang-pct { font: 500 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8b949e; }
  </style>
  <rect x="0.75" y="0.75" width="348.5" height="193.5" rx="10" fill="url(#bg-l-dark)" stroke="#30363d" stroke-width="1.2"/>
  <text x="24" y="34" class="title">Most Used Languages</text>
  <line x1="24" y1="47" x2="326" y2="47" stroke="#262c36" stroke-width="1"/>
